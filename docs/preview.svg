<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <rect width="640" height="300" rx="20" fill="#f3f5f9"/>

  <!-- 左：设置里的后端列表 -->
  <rect x="56" y="46" width="300" height="208" rx="16" fill="#ffffff" stroke="#b7c3d2" stroke-width="2"/>

  <!-- 第一行：被选中的后端 -->
  <rect x="70" y="60" width="272" height="56" rx="12" fill="#e8f0fb"/>
